<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Jarvis</title>
  <link rel="stylesheet" href="style/style.css">
</head>
<body>
  <div id="app">
    <canvas id="sphere"></canvas>
    <div id="status">Dites « Hey Jarvis »</div>
    <button id="settingsBtn" aria-label="Réglages">⚙️</button>
  </div>

  <div id="settingsPanel" class="hidden">
    <div class="settingsBox">
      <h2>Réglages</h2>
      <label for="cityInput">Ta ville (pour la météo)</label>
      <input type="text" id="cityInput" placeholder="Dunkerque">
      <p class="hint">Utilisée uniquement pour te donner la météo locale.</p>
      <div class="settingsActions">
        <button id="saveKeyBtn">Enregistrer</button>
        <button id="closeSettingsBtn">Fermer</button>
      </div>
    </div>
  </div>

  <script src="core/sphere.js"></script>
  <script src="core/settings.js"></script>
  <script src="core/commands.js"></script>
  <script src="core/voice.js"></script>
  <script src="app.js"></script>
</body>
</html>
